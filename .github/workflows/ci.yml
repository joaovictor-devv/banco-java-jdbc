name: FinIA CI

on:
  push:
    branches:
      - dev/finia-desenvolvimento
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Java
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: banco_app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/banco_app?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar e testar backend
        run: mvn -B verify

      - name: Preparar schema MySQL
        run: |
          docker run --rm --network host -i mysql:8.4 \
            mysql -h127.0.0.1 -uroot -proot < database/schema.sql

      - name: Smoke test da API real
        shell: bash
        run: |
          set -euo pipefail

          java -jar target/finia-1.0-SNAPSHOT.jar > /tmp/finia.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          READY=0
          for tentativa in {1..30}; do
            if curl -s -o /dev/null http://localhost:8080/perfil-financeiro; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/finia.log
            exit 1
          fi

          curl -fsS -X PUT http://localhost:8080/perfil-financeiro \
            -H 'Content-Type: application/json' \
            -d '{"nome":"Teste CI","saldoAtual":1200}' \
            | jq -e '.nome == "Teste CI" and .saldoAtual == 1200'

          curl -fsS -X PUT http://localhost:8080/orcamento \
            -H 'Content-Type: application/json' \
            -d '{"rendaMensal":2500,"gastosMensais":1300,"valorPlanejadoGuardar":300}' \
            | jq -e '.rendaMensal == 2500 and .gastosMensais == 1300 and .margemAntesMetas == 900'

          curl -fsS -X POST http://localhost:8080/metas \
            -H 'Content-Type: application/json' \
            -d '{"nome":"Notebook","valorAlvo":5000,"prazoMeses":10,"valorInicial":1000,"prioridade":"alta","descricao":"Meta do teste CI"}' \
            > /tmp/meta-criada.json

          jq -e '.analise.classificacao == "VIAVEL" and .meta.id > 0' /tmp/meta-criada.json
          META_ID=$(jq -r '.meta.id' /tmp/meta-criada.json)

          curl -fsS http://localhost:8080/analise/capacidade-gastos \
            | jq -e '.margemAposMetas == 500 and .capacidadeGastoImediato == 500'

          curl -fsS -X POST http://localhost:8080/analise/simular-gasto \
            -H 'Content-Type: application/json' \
            -d '{"valor":450}' \
            | jq -e '.classificacao == "ATENCAO" and .recomendado == true'

          curl -fsS -X POST http://localhost:8080/simulacoes \
            -H 'Content-Type: application/json' \
            -d '{"nomeCenario":"Teste CI","meses":3,"eventos":[{"mes":2,"tipo":"GASTO_EXTRAORDINARIO","valor":600}]}' \
            | jq -e '.saldoFinalProjetado == 2100 and .totalGastosExtraordinarios == 600 and .projecoesMetas[0].valorProjetado == 2200'

          # Uma simulação nunca pode alterar saldo, orçamento ou progresso reais.
          curl -fsS http://localhost:8080/perfil-financeiro \
            | jq -e '.saldoAtual == 1200 and .rendaMensal == 2500 and .gastosMensais == 1300'

          curl -fsS "http://localhost:8080/metas/$META_ID" \
            | jq -e '.valorInicial == 1000 and .valorAlvo == 5000'

          STATUS_INVIAVEL=$(curl -sS -o /tmp/meta-inviavel.json -w '%{http_code}' \
            -X POST http://localhost:8080/metas \
            -H 'Content-Type: application/json' \
            -d '{"nome":"Meta impossível","valorAlvo":10000,"prazoMeses":1,"valorInicial":0,"prioridade":"media"}')

          test "$STATUS_INVIAVEL" = "422"
          jq -e '.analise.classificacao == "INVIAVEL"' /tmp/meta-inviavel.json

          # Meta inviável precisa ser bloqueada antes da persistência.
          curl -fsS http://localhost:8080/metas \
            | jq -e 'length == 1'

          curl -fsS -X PATCH "http://localhost:8080/metas/$META_ID/progresso" \
            -H 'Content-Type: application/json' \
            -d '{"valorAtual":1500}' \
            | jq -e '.meta.valorInicial == 1500'

          curl -fsS "http://localhost:8080/metas/$META_ID/viabilidade" \
            | jq -e '.valorRestante == 3500 and .viavel == true'

          curl -fsS -X PUT http://localhost:8080/perfil-financeiro/saldo \
            -H 'Content-Type: application/json' \
            -d '{"saldoAtual":1800}' \
            | jq -e '.saldoAtual == 1800'

          STATUS_404=$(curl -sS -o /tmp/meta-nao-encontrada.json -w '%{http_code}' \
            http://localhost:8080/metas/999999)
          test "$STATUS_404" = "404"
          jq -e '.erro == "RECURSO_NAO_ENCONTRADO"' /tmp/meta-nao-encontrada.json

  frontend:
    name: Frontend React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar lint
        run: npm run lint

      - name: Gerar build
        run: npm run build
